<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ink { fill: #8C1515; stroke: #8C1515; }
    .hub { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e8554f; stroke: #e8554f; }
      .hub { fill: #1e2430; }
    }
  </style>
  <g class="ink" stroke-width="3.4" stroke-linecap="round">
    <line x1="8" y1="8" x2="24" y2="24"/>
    <line x1="24" y1="8" x2="8" y2="24"/>
  </g>
  <g class="ink" stroke="none">
    <circle cx="8" cy="8" r="5.2"/>
    <circle cx="24" cy="8" r="5.2"/>
    <circle cx="8" cy="24" r="5.2"/>
    <circle cx="24" cy="24" r="5.2"/>
    <circle cx="16" cy="16" r="4.6"/>
  </g>
  <circle class="hub" cx="16" cy="16" r="1.8"/>
</svg>
